# LeadForge production-like Docker Compose stack.
#
# Runs PostgreSQL and the combined application container with persistent volumes
# for database state and captured website screenshots.
name: leadgen

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: leadgen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: leadgen
    volumes:
      - leadgen_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadgen -d leadgen"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: zeeshanpy/leadgen:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://leadgen:${POSTGRES_PASSWORD}@postgres:5432/leadgen
      FRONTEND_ORIGIN: ${APP_URL:-http://localhost:8000}
      PUBLIC_BACKEND_URL: ${APP_URL:-http://localhost:8000}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      WEB_CONCURRENCY: "1"
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - leadgen_screenshots:/app/storage/screenshots
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  leadgen_postgres:
  leadgen_screenshots:
